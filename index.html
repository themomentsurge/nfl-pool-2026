<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pool NFL 2026-27 — Nic, Yves, Math, J-P, Gab</title>
<!--
  POOL NFL — MODE D'EMPLOI (2 endroits à modifier, tout est indiqué ci-dessous)
  1) Cherche FIREBASE_CONFIG plus bas et colle ta config Firebase (étape 4 des instructions).
     Tant que ce n'est pas fait, la page fonctionne en MODE DÉMO : les choix sont
     enregistrés seulement sur le téléphone/ordi de la personne (localStorage).
  2) Pour changer les participants, modifie la liste PARTICIPANTS.
  3) L'historique (semaines passées) se met dans picks.json, à côté de ce fichier.
     Format : { "8": { "Nic": { "401873023": "GB" }, ... } }
  Scores et horaires : API publique ESPN (gratuite, sans clé) :
  https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard
  Règles : 1 point par bon choix. Match nul : 1 point si tu as choisi une des 2 équipes.
  Un choix se verrouille au coup d'envoi de SON match (les autres matchs restent ouverts).
-->
<style>
  :root{--bg:#081426;--card:#10233f;--card2:#16304f;--text:#f8fafc;--muted:#9db4d0;
    --green:#22c55e;--red:#d50a0a;--gold:#ffb81c;--blue:#38bdf8;--line:#24466e;
    --nfl:#013369;--nflred:#d50a0a}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text)}
  body::before{content:"";display:block;height:6px;
    background:repeating-linear-gradient(90deg,#fff 0 60px,var(--nflred) 60px 120px)}
  header{background:linear-gradient(180deg,#013369 0%,#0a1f3d 78%,#081426 100%);
    padding:26px 16px 20px;text-align:center;border-bottom:3px solid var(--nflred)}
  header h1{margin:0;font-size:30px;letter-spacing:2px;text-transform:uppercase;font-weight:900}
  header h1 span{color:var(--nflred)}
  header p{margin:8px 0 0;color:#cbd5e1;font-size:14px;letter-spacing:.4px}
  .status{display:inline-block;margin-top:12px;font-size:12px;font-weight:800;letter-spacing:.6px;
    text-transform:uppercase;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#bbf7d0}
  .wrap{max-width:980px;margin:0 auto;padding:14px 12px 60px}
  .banner{display:none}
  .banner.demo,.banner.err{display:block;border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14px}
  .banner.demo{background:#451a03;color:#fdba74;border:1px solid #9a3412}
  .banner.err{background:#450a0a;color:#fca5a5;border:1px solid #991b1b}
  section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
  h2{margin:0 0 12px;font-size:16px;letter-spacing:1.2px;text-transform:uppercase;color:#fff}
  h2::after{content:"";display:block;height:3px;width:44px;background:var(--nflred);margin-top:6px;border-radius:2px}
  .who{display:flex;flex-wrap:wrap;gap:8px}
  .who button{flex:1 1 90px;padding:14px 8px;font-size:17px;font-weight:800;border-radius:12px;
    border:2px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer}
  .who button.sel{border-color:var(--nflred);background:linear-gradient(180deg,#d50a0a,#8f0606);color:#fff;
    box-shadow:0 4px 14px rgba(213,10,10,.45)}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .saved{color:var(--green);font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  td:first-child,th:first-child{text-align:left}
  .rank1{color:var(--gold);font-weight:800}
  .leader td{background:rgba(255,184,28,.10)}
  .weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .weeks button{flex:0 0 auto;padding:10px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-weight:700;cursor:pointer;font-size:14px}
  .weeks button.sel{background:var(--nflred);color:#fff;border-color:var(--nflred)}
  .weeks button.done{opacity:.75}
  .game{border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;background:var(--card2)}
  .gdate{color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:800;letter-spacing:.5px;padding:3px 9px;border-radius:999px;background:#334155;text-transform:uppercase}
  .badge.live{background:#7f1d1d;color:#fecaca}
  .badge.final{background:#14532d;color:#bbf7d0}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin-top:10px}
  .team{border:2px solid var(--line);background:#0f172a;border-radius:12px;padding:12px 6px;
    cursor:pointer;text-align:center;color:var(--text);min-height:118px}
  .team img{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 4px}
  .team .nm{font-weight:700;font-size:14px;line-height:1.2}
  .team .ab{color:var(--muted);font-size:12px}
  .team .sc{font-size:22px;font-weight:900;margin-top:2px}
  .team.picked{border-color:var(--gold);background:#3b2f0b;box-shadow:0 0 0 2px rgba(255,184,28,.35)}
  .team.picked::after{content:"TON CHOIX";display:block;margin-top:6px;font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--gold)}
  .team.winner{border-color:var(--green)}
  .team.loser{opacity:.5}
  .team:disabled{cursor:not-allowed}
  .vs{font-weight:900;color:var(--muted);font-size:13px;text-align:center;align-self:center}
  .gmeta{margin-top:8px;font-size:13px;color:var(--muted);text-align:center}
  .gmeta .ok{color:var(--green);font-weight:700}
  .gmeta .ko{color:var(--red);font-weight:700}
  .pickstable td.good{background:rgba(34,197,94,.22);color:#bbf7d0;font-weight:700}
  .pickstable td.bad{background:rgba(239,68,68,.20);color:#fecaca;font-weight:700}
  .pickstable td.pend{color:#cbd5e1}
  .pickstable td.none{color:#475569}
  .pickstable tfoot td{font-weight:800;background:#0f172a}
  .topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
    color:var(--text);font-weight:700;cursor:pointer;font-size:14px}
  .btn:hover{border-color:var(--blue)}
  .prog{height:8px;background:#0f172a;border-radius:99px;overflow:hidden;margin-top:10px}
  .progfill{height:100%;background:linear-gradient(90deg,var(--nflred),var(--gold));border-radius:99px;transition:width .3s}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:0 12px 30px}
  @media (max-width:560px){ header h1{font-size:23px} .team img{width:46px;height:46px} th,td{padding:8px 4px;font-size:13px} }
</style>
</head>
<body>
<header>
  <h1>🏈 Pool <span>NFL</span> 2026-27</h1>
  <p>Saison 2026-27 &nbsp;•&nbsp; 1 point par bon choix</p>
  <div><span id="modeBanner" class="status">● Chargement…</span></div>
</header>
<div class="wrap">

  <section>
    <h2>👤 Ton nom</h2>
    <div class="who" id="who"></div>
    <p class="hint" id="whoHint">Choisis ton nom, puis touche une équipe pour voter.</p>
    <p class="hint" id="saveState"></p>
  </section>

  <section>
    <h2>🏆 Classement</h2>
    <div id="standings">Chargement…</div>
  </section>

  <section>
    <h2>📅 Semaine</h2>
    <div class="weeks" id="weekTabs"></div>
    <div class="topbar" style="margin-top:12px">
      <span id="weekTitle" class="hint" style="font-size:15px;color:var(--text);font-weight:700"></span>
      <button class="btn" id="refreshBtn">↻ Scores</button>
    </div>
    <div id="weekProgress"></div>
  </section>

  <section>
    <h2>🎯 <span id="gamesTitle">Matchs</span></h2>
    <div id="games">Chargement…</div>
  </section>

  <section>
    <h2>📋 Tous les choix</h2>
    <div style="overflow-x:auto">
      <table class="pickstable" id="picksTable"></table>
    </div>
  </section>
</div>
<footer>Scores ESPN • Un choix se verrouille au coup d'envoi de son match.</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

/* ================= À MODIFIER SI BESOIN ================= */
const SEASON = 2026;
const PARTICIPANTS = ["Nic", "Yves", "Math", "J-P", "Gab"];
// Colle ici la config de ton app web Firebase (voir étape 4). Ne mets rien d'autre.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDscXO2tPWF1ixy89hpQsGAlOHGOWv6oN8",
  authDomain: "pool-nfl-2026.firebaseapp.com",
  databaseURL: "https://pool-nfl-2026-default-rtdb.firebaseio.com",
  projectId: "pool-nfl-2026",
  storageBucket: "pool-nfl-2026.firebasestorage.app",
  messagingSenderId: "121509552488",
  appId: "1:121509552488:web:b5f4e741204942d63736dd"
};
// Semaines : 11 à 18 = saison régulière, 19 à 22 = séries (Wild Card, Division, Conférence, Super Bowl)
const WEEKS = [
  { n: 11, label: "Sem. 11", type: 2, api: 11 },
  { n: 12, label: "Sem. 12", type: 2, api: 12 },
  { n: 13, label: "Sem. 13", type: 2, api: 13 },
  { n: 14, label: "Sem. 14", type: 2, api: 14 },
  { n: 15, label: "Sem. 15", type: 2, api: 15 },
  { n: 16, label: "Sem. 16", type: 2, api: 16 },
  { n: 17, label: "Sem. 17", type: 2, api: 17 },
  { n: 18, label: "Sem. 18", type: 2, api: 18 },
  { n: 19, label: "Wild Card", type: 3, api: 1 },
  { n: 20, label: "Division", type: 3, api: 2 },
  { n: 21, label: "Conférence", type: 3, api: 3 },
  { n: 22, label: "Super Bowl", type: 3, api: 4 },
];
/* =============== FIN DES CHOSES À MODIFIER =============== */

// Déf. d'une semaine, même pour les semaines d'historique (ex. sem. 8) qui ne sont pas dans WEEKS.
// Sans ceci, le classement ignorait l'historique : c'était le bug qui affichait 0 partout.
function getWeekDef(n) {
  const w = WEEKS.find((x) => x.n === n);
  if (w) return w;
  if (n >= 1 && n <= 18) return { n, label: "Sem. " + n, type: 2, api: n };
  if (n === 19) return { n, label: "Wild Card", type: 3, api: 1 };
  if (n === 20) return { n, label: "Division", type: 3, api: 2 };
  if (n === 21) return { n, label: "Conférence", type: 3, api: 3 };
  if (n === 22) return { n, label: "Super Bowl", type: 3, api: 4 };
  return null;
}
// Onglets affichés : semaines 11-22 + toute semaine présente dans l'historique (picks.json / Firebase / local)
function tabWeeks() {
  const nums = new Set(WEEKS.map((w) => w.n));
  for (const src of [picksJson, fbPicks, localPicks]) {
    for (const k of Object.keys(src || {})) {
      const n = Number(String(k).replace("week", ""));
      if (n >= 1 && n <= 22) nums.add(n);
    }
  }
  return [...nums].sort((a, b) => a - b).map(getWeekDef).filter(Boolean);
}

const $ = (id) => document.getElementById(id);
const LS_KEY = "nfl-pool-picks-" + SEASON;
const fmtDate = new Intl.DateTimeFormat("fr-CA", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit", timeZone: "America/Toronto" });

let currentWeek = 11;
let currentWeekDef = WEEKS[0];
let weekCache = {};        // clé "type-api" -> { games, byes }
let picksJson = {};        // historique du fichier picks.json
let fbPicks = {};          // choix partagés (Firebase)
let localPicks = loadLocal();
let db = null, firebaseReady = false;
let me = localStorage.getItem("nfl-pool-me") || "";

function loadLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { return {}; } }
function saveLocal() { localStorage.setItem(LS_KEY, JSON.stringify(localPicks)); }
function firebaseConfigured() { return FIREBASE_CONFIG.apiKey && !String(FIREBASE_CONFIG.apiKey).startsWith("COLLE"); }

function setBanner() {
  const b = $("modeBanner");
  if (firebaseReady) { b.className = "status"; b.textContent = "● En direct — choix partagés"; }
  else if (firebaseConfigured()) { b.className = "banner err"; b.textContent = "⚠️ Connexion impossible — choix sur cet appareil seulement."; }
  else { b.className = "banner demo"; b.textContent = "⚠️ Mode démo — choix sur cet appareil seulement."; }
}

function initFirebase() {
  if (!firebaseConfigured()) { setBanner(); return; }
  try {
    const app = initializeApp(FIREBASE_CONFIG);
    db = getDatabase(app);
    onValue(ref(db, "picks/" + SEASON), (snap) => {
      fbPicks = snap.val() || {};
      firebaseReady = true; setBanner(); renderAll();
    }, () => { firebaseReady = false; setBanner(); });
  } catch (e) { console.error(e); firebaseReady = false; setBanner(); }
}

// Choix effectifs pour une semaine : picks.json < local < Firebase
function picksForWeek(n) {
  const out = {};
  for (const src of [picksJson[String(n)] || {}, localPicks["week" + n] || {}, fbPicks["week" + n] || {}]) {
    for (const p of Object.keys(src)) out[p] = Object.assign({}, out[p] || {}, src[p]);
  }
  return out;
}

async function fetchWeek(def) {
  const key = def.type + "-" + def.api;
  if (weekCache[key]) return weekCache[key];
  const url = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?season=" + SEASON + "&seasontype=" + def.type + "&week=" + def.api;
  const d = await (await fetch(url)).json();
  const games = (d.events || []).map((e) => {
    const comp = e.competitions[0];
    const get = (ha) => comp.competitors.find((c) => c.homeAway === ha);
    const away = get("away"), home = get("home");
    return {
      id: e.id, date: e.date,
      shortDetail: e.status.type.shortDetail || "",
      state: e.status.type.state, // pre | in | post
      clock: e.status.displayClock || "", period: e.status.period || 0,
      away: { abbr: away.team.abbreviation, name: away.team.displayName, logo: away.team.logo, score: away.score == null ? null : Number(away.score) },
      home: { abbr: home.team.abbreviation, name: home.team.displayName, logo: home.team.logo, score: home.score == null ? null : Number(home.score) },
    };
  }).sort((a, b) => new Date(a.date) - new Date(b.date));
  const byes = (d.week && d.week.teamsOnBye ? d.week.teamsOnBye : []).map((t) => t.abbreviation);
  const out = { games, byes };
  weekCache[key] = out;
  return out;
}

function winnerOf(g) {
  if (g.state !== "post" || g.away.score == null || g.home.score == null) return null;
  if (g.away.score === g.home.score) return "TIE";
  return g.away.score > g.home.score ? g.away.abbr : g.home.abbr;
}
function pointsForPick(g, pick) {
  const w = winnerOf(g);
  if (!w || !pick) return null; // null = match pas encore décidé
  if (w === "TIE") return (pick === g.away.abbr || pick === g.home.abbr) ? 1 : 0;
  return pick === w ? 1 : 0;
}
function isLocked(g) {
  if (g.state !== "pre") return true;
  if ((g.shortDetail || "").toUpperCase().includes("TBD")) return false; // heure pas encore fixée (ex. sem. 18)
  return new Date(g.date).getTime() <= Date.now();
}
function weekKey(n) { return "week" + n; }

async function savePick(weekN, gameId, abbr) {
  if (!me) { alert("Choisis d'abord ton nom en haut de la page."); return; }
  const g = (weekCache[currentWeekDef.type + "-" + currentWeekDef.api] || { games: [] }).games.find((x) => x.id === gameId);
  if (g && isLocked(g)) { alert("Trop tard : ce match est commencé, le choix est verrouillé."); renderAll(); return; }
  localPicks[weekKey(weekN)] = localPicks[weekKey(weekN)] || {};
  localPicks[weekKey(weekN)][me] = localPicks[weekKey(weekN)][me] || {};
  localPicks[weekKey(weekN)][me][gameId] = abbr;
  saveLocal();
  $("saveState").innerHTML = "<span class='saved'>✓ Choix enregistré : " + abbr + "</span>";
  if (firebaseReady && db) {
    try { await set(ref(db, "picks/" + SEASON + "/" + weekKey(weekN) + "/" + me + "/" + gameId), abbr); }
    catch (e) { console.error(e); $("saveState").textContent = "Choix gardé sur cet appareil seulement (erreur Firebase)."; }
  }
  renderAll();
}

/* ---------------- Affichage ---------------- */
function renderWho() {
  $("who").innerHTML = PARTICIPANTS.map((p) =>
    "<button class='" + (p === me ? "sel" : "") + "' data-p='" + p + "'>" + p + "</button>").join("");
  document.querySelectorAll("#who button").forEach((b) => b.onclick = () => {
    me = b.dataset.p; localStorage.setItem("nfl-pool-me", me); renderAll();
  });
  $("whoHint").textContent = me
    ? "Tu es " + me + ". Touche une équipe pour voter, c'est enregistré aussitôt."
    : "Choisis ton nom, puis touche une équipe pour voter.";
}

function renderTabs() {
  $("weekTabs").innerHTML = tabWeeks().map((w) => {
    const cached = weekCache[w.type + "-" + w.api];
    const done = cached && cached.games.length && cached.games.every((g) => g.state === "post");
    return "<button class='" + (w.n === currentWeek ? "sel" : "") + (done ? " done" : "") + "' data-w='" + w.n + "'>" + w.label + "</button>";
  }).join("");
  document.querySelectorAll("#weekTabs button").forEach((b) => b.onclick = async () => {
    currentWeek = Number(b.dataset.w);
    currentWeekDef = getWeekDef(currentWeek);
    await loadWeek(); renderAll();
  });
}

function teamBtn(g, side) {
  const t = g[side];
  const pick = me ? (picksForWeek(currentWeek)[me] || {})[g.id] : null;
  const w = winnerOf(g);
  let cls = "team";
  if (pick === t.abbr) cls += " picked";
  if (w && w !== "TIE") cls += (w === t.abbr ? " winner" : " loser");
  const score = t.score == null ? "" : "<div class='sc'>" + t.score + "</div>";
  const locked = isLocked(g);
  return "<button class='" + cls + "' " + (locked ? "disabled" : "") +
    " data-game='" + g.id + "' data-abbr='" + t.abbr + "' title='" + t.name + "'>" +
    "<img src='" + t.logo + "' alt='" + t.abbr + "' loading='lazy'>" +
    "<div class='nm'>" + t.name + "</div><div class='ab'>" + t.abbr + "</div>" + score + "</button>";
}

function renderGames(data) {
  const picks = picksForWeek(currentWeek);
  const title = currentWeekDef.label + (currentWeekDef.n >= 19 ? " — séries" : "") + " • " + data.games.length + " matchs";
  $("gamesTitle").textContent = title;
  $("weekTitle").textContent = title + (data.byes.length ? " • En congé : " + data.byes.join(", ") : "");
  const myPicks = (me && picks[me]) || {};
  const done = data.games.filter((g) => g.state === "post").length;
  const n = Object.keys(myPicks).length, tot = data.games.length;
  $("weekProgress").innerHTML = me
    ? "<div class='prog'><div class='progfill' style='width:" + Math.round(100 * n / Math.max(tot, 1)) + "%'></div></div><p class='hint'>" + n + " / " + tot + " choix • " + done + " match(s) terminé(s)</p>"
    : "<p class='hint'>" + tot + " matchs • " + done + " terminé(s)</p>";
  if (!data.games.length) { $("games").innerHTML = "<p class='hint'>Aucun match pour cette semaine pour l'instant (les équipes des séries ne sont pas encore connues).</p>"; return; }
  $("games").innerHTML = data.games.map((g) => {
    const locked = isLocked(g);
    const w = winnerOf(g);
    let badge = "<span class='badge'>À venir</span>";
    if (g.state === "in") badge = "<span class='badge live'>EN COURS" + (g.period ? " • Q" + g.period : "") + (g.clock ? " • " + g.clock : "") + "</span>";
    if (g.state === "post") badge = "<span class='badge final'>FINAL" + (g.shortDetail.includes("OT") ? " / OT" : "") + "</span>";
    let meta = "";
    if (me) {
      const myPick = myPicks[g.id];
      if (!myPick) meta = locked ? "Match commencé" : "Touche ton gagnant 👆";
      else if (w === null) meta = "Ton choix : <b>" + myPick + "</b>" + (locked ? " (verrouillé)" : "");
      else if (w === "TIE") meta = "Match nul — <span class='ok'>+1 pt</span> (ton choix : " + myPick + ")";
      else meta = myPick === w
        ? "Ton choix : <b>" + myPick + "</b> — <span class='ok'>✓ +1 pt</span>"
        : "Ton choix : <b>" + myPick + "</b> — <span class='ko'>✗ 0 pt</span> (gagnant : " + w + ")";
    } else if (w) meta = "Gagnant : <b>" + (w === "TIE" ? "Match nul" : w) + "</b>";
    return "<div class='game'><div class='gdate'><span>" + fmtDate.format(new Date(g.date)) + "</span><span>" + badge + "</span></div>" +
      "<div class='teams'>" + teamBtn(g, "away") + "<div class='vs'>@</div>" + teamBtn(g, "home") + "</div>" +
      "<div class='gmeta'>" + (locked && g.state === "pre" ? "🔒 Verrouillé — match commencé. " : "") + meta + "</div></div>";
  }).join("");
  document.querySelectorAll("#games .team:not(:disabled)").forEach((b) => b.onclick = () => savePick(currentWeek, b.dataset.game, b.dataset.abbr));
}

function renderPicksTable(data) {
  const picks = picksForWeek(currentWeek);
  let html = "<thead><tr><th>Match</th>" + PARTICIPANTS.map((p) => "<th>" + p + "</th>").join("") + "</tr></thead><tbody>";
  for (const g of data.games) {
    html += "<tr><td>" + g.away.abbr + " @ " + g.home.abbr + "<br><span style='color:var(--muted);font-size:12px'>" + fmtDate.format(new Date(g.date)) + "</span></td>";
    for (const p of PARTICIPANTS) {
      const pick = (picks[p] || {})[g.id];
      if (!pick) { html += "<td class='none'>—</td>"; continue; }
      const pts = pointsForPick(g, pick);
      const cls = pts == null ? "pend" : (pts > 0 ? "good" : "bad");
      html += "<td class='" + cls + "'>" + pick + (pts === 1 ? " ✓" : pts === 0 ? " ✗" : "") + "</td>";
    }
    html += "</tr>";
  }
  html += "</tbody><tfoot><tr><td>Total semaine</td>";
  for (const p of PARTICIPANTS) {
    let tot = 0, n = 0;
    for (const g of data.games) { const pts = pointsForPick(g, (picks[p] || {})[g.id]); if (pts != null) { tot += pts; n++; } }
    html += "<td>" + tot + " / " + n + "</td>";
  }
  html += "</tr></tfoot>";
  $("picksTable").innerHTML = html;
}

async function renderStandings() {
  // Semaines à compter : historique dans picks.json + semaines 11 à 18 (+ séries si des choix existent)
  const weekNums = new Set(Object.keys(picksJson).map(Number));
  for (let n = 11; n <= 18; n++) weekNums.add(n);
  for (const n of Object.keys(fbPicks).map((k) => Number(k.replace("week", "")))) weekNums.add(n);
  for (const n of Object.keys(localPicks).map((k) => Number(k.replace("week", "")))) weekNums.add(n);
  const defs = [...weekNums].map((n) => getWeekDef(n)).filter(Boolean);
  const stats = {}; PARTICIPANTS.forEach((p) => stats[p] = { pts: 0, bons: 0, joues: 0, semPts: 0, semJoues: 0 });
  await Promise.all(defs.map(async (def) => {
    const data = await fetchWeek(def);
    const picks = picksForWeek(def.n);
    for (const p of PARTICIPANTS) {
      for (const g of data.games) {
        const pts = pointsForPick(g, (picks[p] || {})[g.id]);
        if (pts == null) continue;
        stats[p].pts += pts; stats[p].bons += pts; stats[p].joues++;
        if (def.n === currentWeek) { stats[p].semPts += pts; stats[p].semJoues++; }
      }
    }
  }));
  const rows = PARTICIPANTS.map((p) => ({ p, ...stats[p] }))
    .sort((a, b) => b.pts - a.pts || b.bons - a.bons);
  $("standings").innerHTML = "<table><thead><tr><th>#</th><th>Joueur</th><th>Total</th><th>Sem.</th><th>%</th></tr></thead><tbody>" +
    rows.map((r, i) => "<tr class='" + (i === 0 ? "leader" : "") + "'><td class='" + (i === 0 ? "rank1" : "") + "'>" + (i + 1) + "</td><td style='text-align:left;font-weight:700'>" + (i === 0 ? "👑 " : "") + r.p + "</td><td style='font-weight:900;font-size:17px'>" + r.pts + "</td><td>" + r.semPts + " / " + r.semJoues + "</td><td>" + (r.joues ? Math.round(100 * r.bons / r.joues) + " %" : "—") + "</td></tr>").join("") +
    "</tbody></table>";
}

function renderAll() {
  renderWho(); renderTabs();
  const key = currentWeekDef.type + "-" + currentWeekDef.api;
  if (weekCache[key]) { renderGames(weekCache[key]); renderPicksTable(weekCache[key]); }
}

async function loadWeek() {
  $("games").textContent = "Chargement des matchs…";
  const data = await fetchWeek(currentWeekDef);
  renderGames(data); renderPicksTable(data); renderTabs();
}

async function loadHistory() {
  try { const r = await fetch("picks.json"); if (r.ok) picksJson = await r.json(); } catch (e) { picksJson = {}; }
}

$("refreshBtn").onclick = async () => {
  delete weekCache[currentWeekDef.type + "-" + currentWeekDef.api];
  await loadWeek(); await renderStandings();
};
(async function init() {
  initFirebase();
  await loadHistory();
  // Semaine courante selon ESPN (sans paramètre = semaine en cours)
  try {
    const d = await (await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?season=" + SEASON + "&seasontype=2")).json();
    if (d.week && d.week.number >= 11 && d.week.number <= 18) {
      currentWeek = d.week.number;
      currentWeekDef = getWeekDef(currentWeek);
    }
  } catch (e) { /* on reste sur la semaine 11 */ }
  renderAll();
  await loadWeek();
  await renderStandings();
  setInterval(async () => { // rafraîchit les scores toutes les 60 s
    delete weekCache[currentWeekDef.type + "-" + currentWeekDef.api];
    try { await loadWeek(); await renderStandings(); } catch (e) {}
  }, 60000);
})();
</script>
